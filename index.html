<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalrusTears - MCTiers Style Tier List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #d1d5db; font-family: system-ui, -apple-system, sans-serif; }
    
    /* Tier Gradients like MCTiers */
    .tier-ht1 { background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%); border: 1px solid #ef4444; }
    .tier-lt1 { background: linear-gradient(135deg, #c2410c 0%, #7c2d12 100%); border: 1px solid #f97316; }
    .tier-ht2 { background: linear-gradient(135deg, #b45309 0%, #713f12 100%); border: 1px solid #f59e0b; }
    .tier-lt2 { background: linear-gradient(135deg, #a16207 0%, #613807 100%); border: 1px solid #eab308; }
    .tier-ht3 { background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%); border: 1px solid #3b82f6; }
    .tier-lt3 { background: linear-gradient(135deg, #0284c7 0%, #075985 100%); border: 1px solid #38bdf8; }
  </style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col justify-between">

  <div>
    <!-- Top Header Navigation -->
    <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 mb-6 pb-4 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center font-black text-xl text-white shadow-lg">WT</div>
        <div>
          <h1 class="text-xl font-black tracking-wider text-white">WALRUSTEARS</h1>
          <p class="text-xs text-gray-400">Official Community Tier List</p>
        </div>
      </div>

      <!-- Gamemodes Tabs (Overall, Mace, Sword, etc.) -->
      <div class="flex gap-1.5 bg-gray-900/90 p-1.5 rounded-xl border border-gray-800 overflow-x-auto w-full md:w-auto">
        <button onclick="switchMode('Overall')" id="btn-Overall" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg bg-red-600 text-white shadow">Overall</button>
        <button onclick="switchMode('Mace')" id="btn-Mace" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white">Mace</button>
        <button onclick="switchMode('Sword')" id="btn-Sword" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white">Sword</button>
        <button onclick="switchMode('Crystal')" id="btn-Crystal" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white">Crystal</button>
        <button onclick="switchMode('Axe')" id="btn-Axe" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white">Axe</button>
        <button onclick="switchMode('Nethpot')" id="btn-Nethpot" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white">Nethpot</button>
        <button onclick="switchMode('SMP')" id="btn-SMP" class="gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white">SMP</button>
      </div>
    </header>

    <!-- Filters Bar -->
    <div class="max-w-7xl mx-auto mb-6 flex flex-col sm:flex-row gap-3 justify-between items-center bg-gray-900/50 p-3 rounded-xl border border-gray-800/80">
      <input type="text" id="search" onkeyup="renderCards()" placeholder="Search player name..." class="bg-gray-950 border border-gray-800 text-xs px-3.5 py-2 rounded-lg text-white w-full sm:w-64 focus:outline-none focus:border-red-500">
      
      <select id="region" onchange="renderCards()" class="bg-gray-950 border border-gray-800 text-xs px-3.5 py-2 rounded-lg text-gray-300 focus:outline-none focus:border-red-500 w-full sm:w-auto">
        <option value="ALL">All Regions</option>
        <option value="NA">NA (North America)</option>
        <option value="EU">EU (Europe)</option>
        <option value="AS">AS (Asia)</option>
      </select>
    </div>

    <!-- Tier-by-Tier Cards Grid -->
    <main id="tier-grid" class="max-w-7xl mx-auto space-y-6">
      <!-- Dynamic Data Inserted Here -->
    </main>
  </div>

  <footer class="text-center text-gray-600 text-xs py-8">
    © WalrusTears Tier List • Powered by Vercel
  </footer>

  <script>
    // MCTiers-style Player Tier Database
    const database = {
      Overall: {
        'HT1 (High Tier 1)': [{ name: 'htap', region: 'NA' }, { name: 'ClownPierce', region: 'EU' }],
        'LT1 (Low Tier 1)': [{ name: 'Walrus', region: 'NA' }, { name: 'Minemanner', region: 'AS' }],
        'HT2 (High Tier 2)': [{ name: 'Coldness', region: 'NA' }]
      },
      Mace: {
        'HT1 (High Tier 1)': [{ name: 'htap', region: 'NA' }],
        'LT1 (Low Tier 1)': [{ name: 'ClownPierce', region: 'EU' }]
      },
      Sword: {
        'HT1 (High Tier 1)': [{ name: 'htap', region: 'NA' }, { name: 'Walrus', region: 'NA' }],
        'LT1 (Low Tier 1)': [{ name: 'Minemanner', region: 'AS' }],
        'HT2 (High Tier 2)': [{ name: 'Coldness', region: 'NA' }]
      },
      Crystal: {
        'HT1 (High Tier 1)': [{ name: 'Minemanner', region: 'AS' }, { name: 'htap', region: 'NA' }],
        'LT1 (Low Tier 1)': [{ name: 'Walrus', region: 'NA' }]
      },
      Axe: {
        'HT1 (High Tier 1)': [{ name: 'ClownPierce', region: 'EU' }, { name: 'htap', region: 'NA' }]
      },
      Nethpot: {
        'HT1 (High Tier 1)': [{ name: 'htap', region: 'NA' }],
        'LT1 (Low Tier 1)': [{ name: 'Walrus', region: 'NA' }]
      },
      SMP: {
        'HT1 (High Tier 1)': [{ name: 'htap', region: 'NA' }, { name: 'ClownPierce', region: 'EU' }]
      }
    };

    let activeMode = 'Overall';

    function getTierStyle(tier) {
      if (tier.startsWith('HT1')) return 'tier-ht1';
      if (tier.startsWith('LT1')) return 'tier-lt1';
      if (tier.startsWith('HT2')) return 'tier-ht2';
      if (tier.startsWith('LT2')) return 'tier-lt2';
      if (tier.startsWith('HT3')) return 'tier-ht3';
      return 'tier-lt3';
    }

    function renderCards() {
      const grid = document.getElementById('tier-grid');
      const search = document.getElementById('search').value.toLowerCase();
      const region = document.getElementById('region').value;

      grid.innerHTML = '';
      const currentTierData = database[activeMode] || {};

      let hasPlayers = false;

      Object.keys(currentTierData).forEach(tierName => {
        const players = currentTierData[tierName].filter(p => {
          const matchSearch = p.name.toLowerCase().includes(search);
          const matchRegion = region === 'ALL' || p.region === region;
          return matchSearch && matchRegion;
        });

        if (players.length > 0) {
          hasPlayers = true;
          const tierStyle = getTierStyle(tierName);

          let playerCardsHTML = players.map(p => `
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-2.5 flex items-center gap-3 hover:border-gray-700 transition shadow-md">
              <img src="https://mc-heads.net/avatar/${p.name}/40" class="w-10 h-10 rounded-lg bg-gray-800 shadow" alt="${p.name}">
              <div class="overflow-hidden">
                <h4 class="font-bold text-sm text-white truncate">${p.name}</h4>
                <span class="text-[10px] font-semibold text-gray-400 bg-gray-800 px-1.5 py-0.5 rounded">${p.region}</span>
              </div>
            </div>
          `).join('');

          const tierBlock = `
            <div class="bg-gray-900/30 border border-gray-800/60 rounded-2xl p-4">
              <div class="inline-block px-3 py-1 rounded-lg text-xs font-black shadow-lg mb-3 ${tierStyle}">
                ${tierName}
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                ${playerCardsHTML}
              </div>
            </div>
          `;

          grid.innerHTML += tierBlock;
        }
      });

      if (!hasPlayers) {
        grid.innerHTML = `<div class="text-center py-12 text-gray-500 text-sm">No players found for this gamemode/filter.</div>`;
      }
    }

    function switchMode(mode) {
      activeMode = mode;
      document.querySelectorAll('.gm-btn').forEach(btn => {
        btn.className = 'gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-gray-400 hover:text-white';
      });
      document.getElementById(`btn-${mode}`).className = 'gm-btn px-3.5 py-1.5 text-xs font-bold rounded-lg bg-red-600 text-white shadow';
      renderCards();
    }

    // Initial Load
    renderCards();
  </script>
</body>
</html>
