<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalrusTears - Minecraft Tier List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Header Section -->
  <header class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center pb-6 mb-6 border-b border-gray-800 gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-cyan-600 rounded-lg flex items-center justify-center font-black text-xl text-white">WT</div>
      <h1 class="text-2xl font-black tracking-wider text-cyan-400">WALRUSTEARS</h1>
    </div>
    
    <!-- Gamemode Selector -->
    <div class="flex gap-2 bg-gray-900 p-1.5 rounded-xl border border-gray-800 text-sm overflow-x-auto w-full md:w-auto">
      <button class="px-4 py-2 bg-cyan-600 text-white font-bold rounded-lg shadow">Sword</button>
      <button class="px-4 py-2 text-gray-400 hover:text-white transition">Crystal</button>
      <button class="px-4 py-2 text-gray-400 hover:text-white transition">Axe</button>
      <button class="px-4 py-2 text-gray-400 hover:text-white transition">Pot</button>
    </div>
  </header>

  <!-- Leaderboard Container -->
  <main class="max-w-5xl mx-auto bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-800/60 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-800">
            <th class="p-4">Rank</th>
            <th class="p-4">Player</th>
            <th class="p-4">Tier</th>
            <th class="p-4">Region</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-800/60 text-sm">
          
          <!-- Player Row 1 -->
          <tr class="hover:bg-gray-800/40 transition">
            <td class="p-4 font-black text-cyan-400">#1</td>
            <td class="p-4 flex items-center gap-3 font-semibold">
              <img src="https://mc-heads.net/avatar/Walrus/32" class="w-8 h-8 rounded-md shadow" alt="Walrus">
              Walrus
            </td>
            <td class="p-4">
              <span class="px-3 py-1 rounded-md text-xs font-black bg-red-600 text-white shadow">HT1</span>
            </td>
            <td class="p-4 text-gray-400 font-medium">NA</td>
          </tr>

          <!-- Player Row 2 -->
          <tr class="hover:bg-gray-800/40 transition">
            <td class="p-4 font-black text-gray-500">#2</td>
            <td class="p-4 flex items-center gap-3 font-semibold">
              <img src="https://mc-heads.net/avatar/ClownPierce/32" class="w-8 h-8 rounded-md shadow" alt="ClownPierce">
              ClownPierce
            </td>
            <td class="p-4">
              <span class="px-3 py-1 rounded-md text-xs font-black bg-red-600 text-white shadow">HT1</span>
            </td>
            <td class="p-4 text-gray-400 font-medium">EU</td>
          </tr>

          <!-- Player Row 3 -->
          <tr class="hover:bg-gray-800/40 transition">
            <td class="p-4 font-black text-gray-500">#3</td>
            <td class="p-4 flex items-center gap-3 font-semibold">
              <img src="https://mc-heads.net/avatar/Minemanner/32" class="w-8 h-8 rounded-md shadow" alt="Minemanner">
              Minemanner
            </td>
            <td class="p-4">
              <span class="px-3 py-1 rounded-md text-xs font-black bg-orange-600 text-white shadow">LT1</span>
            </td>
            <td class="p-4 text-gray-400 font-medium">AS</td>
          </tr>

          <!-- Player Row 4 -->
          <tr class="hover:bg-gray-800/40 transition">
            <td class="p-4 font-black text-gray-500">#4</td>
            <td class="p-4 flex items-center gap-3 font-semibold">
              <img src="https://mc-heads.net/avatar/Coldness/32" class="w-8 h-8 rounded-md shadow" alt="Coldness">
              Coldness
            </td>
            <td class="p-4">
              <span class="px-3 py-1 rounded-md text-xs font-black bg-amber-600 text-white shadow">HT2</span>
            </td>
            <td class="p-4 text-gray-400 font-medium">NA</td>
          </tr>

        </tbody>
      </table>
    </div>
  </main>

  <footer class="text-center text-gray-600 text-xs mt-8">
    © WalrusTears Tier List • Powered by Vercel
  </footer>

</body>
</html>
